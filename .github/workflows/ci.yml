name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gin-api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gin-api"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

      - name: Install migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3

      - name: Migrate
        run: migrate -path migrations -database "postgres://postgres:postgres@localhost:5432/gin-api?sslmode=disable" up

      - name: Test
        env:
          INTEGRATION: "1"
          DATABASE_HOST: localhost
          DATABASE_PASSWORD: postgres
          REDIS_HOST: localhost
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o bin/server ./cmd/server
